<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>VeloxTube</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="header">
            <h1>VeloxTube</h1>
            <label class="theme" title="Light theme">
                <input id="lightThemeEnabled" type="checkbox" aria-label="Light theme" />
                <svg class="moon" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M13.2 10.4A5.9 5.9 0 0 1 5.6 2.8a6 6 0 1 0 7.6 7.6Z" />
                </svg>
                <svg class="sun" viewBox="0 0 16 16" aria-hidden="true">
                    <circle cx="8" cy="8" r="3" />
                    <path
                        d="M8 1v2M8 13v2M1 8h2M13 8h2M2.5 2.5l1.4 1.4M12.1 12.1l1.4 1.4M13.5 2.5l-1.4 1.4M3.9 12.1l-1.4 1.4"
                    />
                </svg>
            </label>
        </div>
        <h2>Masthead</h2>
        <label>
            <span>Top Logo</span>
            <input id="topLogoEnabled" type="checkbox" />
        </label>
        <label>
            <span>Notification Bell</span>
            <input id="notificationBellEnabled" type="checkbox" />
        </label>
        <label>
            <span>Mic Button</span>
            <input id="micButtonEnabled" type="checkbox" />
        </label>
        <hr />

        <!-- HOME FEED -->
        <h2>Home Feed</h2>
        <label>
            <span>Hide Shorts</span>
            <input id="homeShortsEnabled" type="checkbox" />
        </label>
        <label>
            <span>Hide YouTube Featured</span>
            <input id="homeYoutubeFeaturedEnabled" type="checkbox" />
        </label>
        <label>
            <span>Hide Feed</span>
            <input id="homeHomeFeedEnabled" type="checkbox" />
        </label>
        <label>
            <span>Hide Subscriptions</span>
            <input id="homeSubscriptionsButtonEnabled" type="checkbox" />
        </label>
        <label>
            <span>Hide Youtube Playables</span>
            <input id="homeYoutubePlayablesEnabled" type="checkbox" />
        </label>
        <label>
            <span>Hide Topic Bar</span>
            <input id="homeTopicBarEnabled" type="checkbox" />
        </label>
        <!--  -->

        <!-- SEARCH FEED -->
        <hr />
        <h2>Search Feed</h2>
        <label>
            <span>Hide Shorts</span>
            <input id="searchShortsEnabled" type="checkbox" />
        </label>
        <label>
            <span>Hide Topic Bar</span>
            <input id="searchTopicBarEnabled" type="checkbox" />
        </label>

        <hr />
        <!--  -->

        <!-- VIDEO FEED -->
        <h2>Video Feed</h2>
        <label>
            <span>Join Button</span>
            <input id="videoJoinButtonEnabled" type="checkbox" />
        </label>
        <label>
            <span>Thanks Button</span>
            <input id="videoThanksButtonEnabled" type="checkbox" />
        </label>
        <label>
            <span>Share Button</span>
            <input id="videoShareButtonEnabled" type="checkbox" />
        </label>
        <label>
            <span>Related Videos</span>
            <input id="videoShowRelatedVideosEnabled" type="checkbox" />
        </label>
        <label>
            <span>Comments</span>
            <input id="videoShowCommentsEnabled" type="checkbox" />
        </label>
        <label>
            <span>Description</span>
            <input id="videoShowDescriptionEnabled" type="checkbox" />
        </label>
        <label>
            <span>Live Chat</span>
            <input id="videoShowLiveChatEnabled" type="checkbox" />
        </label>
        <label>
            <span>Hide More Actions</span>
            <input id="videoMoreActionsEnabled" type="checkbox" />
        </label>

        <!--  -->

        <hr />
        <h2>Channel</h2>
        <label>
            <span>Join Button</span>
            <input id="channelJoinButtonEnabled" type="checkbox" />
        </label>
        <hr />
        <h2>Feeds</h2>
        <label>
            <span>In-Feed Ads</span>
            <input id="inFeedAdsEnabled" type="checkbox" />
        </label>
        <hr />

        <!-- SIDEBAR -->
        <h2>Sidebar</h2>
        <label>
            <span>Sidebar Shorts</span>
            <input id="sidebarShortsEnabled" type="checkbox" />
        </label>
        <label>
            <span>Subscriptions Menu</span>
            <input id="sidebarSubscriptionsMenuEnabled" type="checkbox" />
        </label>
        <label>
            <span>Sidebar Footer</span>
            <input id="sidebarFooterEnabled" type="checkbox" />
        </label>
        <label>
            <span>More from YouTube</span>
            <input id="moreFromYouTubeEnabled" type="checkbox" />
        </label>
        <label>
            <span>Explore Menu</span>
            <input id="exploreMenuEnabled" type="checkbox" />
        </label>

        <!--  -->

        <hr />
        <a
            class="github"
            href="https://github.com/smartestnerdfromtown/veloxtube"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub repository"
            title="GitHub repository"
        >
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
                />
            </svg>
        </a>
        <script src="index.js"></script>
    </body>
</html>
